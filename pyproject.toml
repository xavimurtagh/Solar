[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarlab"
version = "0.1.0"
description = "Why solar panels are ~20% efficient, and how to improve them — a first-principles analysis toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pvlib>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
solarlab = "solarlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solarlab = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
